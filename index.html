<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pheee Playground</title>
    <meta
      name="description"
      content="A starter site built with plain HTML, CSS, and JavaScript."
    />

    <!-- Set the saved theme before the page paints, so there's no flash -->
    <script>
      try {
        var t = localStorage.getItem("theme");
        if (t) document.documentElement.setAttribute("data-theme", t);
        var a = localStorage.getItem("accent");
        if (a) document.documentElement.setAttribute("data-accent", a);
      } catch (e) {}
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Figtree:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <button class="cornify-button" id="cornify-btn" type="button">
      Cornify this page <span aria-hidden="true">✨</span>
    </button>
    <p class="cornify-status" id="cornify-status" role="status" aria-live="polite"></p>

    <header class="site-header">
      <a class="brand" href="#top">Pheee Playground</a>

      <button
        class="nav-toggle"
        id="nav-toggle"
        aria-expanded="false"
        aria-controls="site-nav"
      >
        Menu
      </button>

      <nav class="site-nav" id="site-nav" aria-label="Main">
        <a href="#playground">Playground</a>
        <button class="theme-toggle" id="theme-toggle" type="button">
          Dark mode
        </button>
        <div class="accent-picker">
          <p class="accent-label" id="accent-label">Accent color</p>
          <div class="swatches" role="group" aria-labelledby="accent-label">
            <button
              class="swatch"
              data-accent="blue"
              aria-label="Blue"
              aria-pressed="true"
            ></button>
            <button
              class="swatch"
              data-accent="coral"
              aria-label="Coral"
              aria-pressed="false"
            ></button>
            <button
              class="swatch"
              data-accent="green"
              aria-label="Green"
              aria-pressed="false"
            ></button>
            <button
              class="swatch"
              data-accent="violet"
              aria-label="Violet"
              aria-pressed="false"
            ></button>
          </div>
        </div>
      </nav>
    </header>

    <main id="main">
      <section class="hero" id="top">
        <figure class="dog">
          <div class="dog-frame">
            <img id="dog-img" alt="Phee" width="1200" height="600" hidden />
            <p class="dog-fallback" id="dog-fallback">Loading a Phee photo…</p>
          </div>
          <figcaption class="dog-bar">
            <span id="dog-caption" role="status">Phee</span>
            <div class="dog-actions">
              <button class="button" id="dog-api-btn" type="button">
                Random dog
              </button>
              <button class="button" id="phee-btn" type="button">
                Random Phee
              </button>
            </div>
          </figcaption>
          <p class="dog-source">
            Random dog photos from the
            <a href="https://dog.ceo/dog-api/">Dog CEO API</a>.
          </p>
        </figure>
      </section>

      <section class="section facts" id="facts" aria-labelledby="facts-title">
        <div class="fact-heading">
          <div>
            <p class="fact-kicker">A small diversion</p>
            <h2 id="facts-title">Today's useless fact</h2>
          </div>
          <button class="button" id="fact-btn" type="button">
            Random fact
          </button>
        </div>
        <p class="fact-text" id="fact-text" role="status" aria-live="polite">
          Fetching today's fact...
        </p>
        <p class="fact-source" id="fact-source" hidden></p>
      </section>

      <section
        class="section"
        id="playground"
        aria-labelledby="playground-title"
      >
        <h2 id="playground-title">Playground</h2>
        <div id="playground-app">
          <noscript><p>The games need JavaScript turned on.</p></noscript>
        </div>
      </section>

    </main>

    <footer class="site-footer">
      <p>&copy; <span id="year">2026</span> Pheee Playground</p>
    </footer>

    <script type="module" src="js/main.js"></script>
    <script type="module" src="games/playground.js"></script>
  </body>
</html>
